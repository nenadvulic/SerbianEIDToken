name: SerbianEIDTokenApp
options:
  bundleIdPrefix: rs.serbiandocuments
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  knownRegions: [en, sr, sr-Latn]
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: "$(SEID_TEAM_ID)"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: "$(ARCHS_STANDARD)"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  SerbianEIDPKI:
    path: ..
targets:
  SerbianEIDTokenApp:
    type: application
    platform: macOS
    sources:
      - App
      - path: ../Sources/seid-bench/SmartCardTransport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rs.serbiandocuments.SerbianEIDTokenApp
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: SerbianEIDPKI
        product: SerbianEIDPKI
      - package: SerbianEIDPKI
        product: SerbianEIDSetup
      - target: SerbianEIDToken
  SerbianEIDToken:
    type: app-extension
    platform: macOS
    sources:
      - Extension
      - path: ../Sources/seid-bench/SmartCardTransport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rs.serbiandocuments.SerbianEIDTokenApp.SerbianEIDToken
        PRODUCT_NAME: SerbianEIDToken
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: SerbianEIDPKI
        product: SerbianEIDPKI
      - sdk: CryptoTokenKit.framework
